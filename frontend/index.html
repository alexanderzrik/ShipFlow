<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طيارة - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0f172a] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 border-t-8 border-[#eab308]">
        
        <div class="text-center mb-8">
            <img src="logo.png" alt="شعار طيارة" class="w-32 h-32 mx-auto mb-4 object-contain rounded-full shadow-sm">
            <h1 class="text-4xl font-bold text-[#0f172a] mb-1">طيارة</h1>
            <p class="text-gray-500 text-sm font-semibold">نظام إدارة الشحن</p>
        </div>

        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6 text-sm"></div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">اسم المستخدم</label>
                <input type="text" id="username" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#eab308] transition"
                       placeholder="أدخل اسم المستخدم" value="admin">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">كلمة المرور</label>
                <input type="password" id="password" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#eab308] transition"
                       placeholder="أدخل كلمة المرور" value="Admin12345">
            </div>

            <button type="submit" id="loginBtn"
                    class="w-full bg-[#eab308] hover:bg-[#ca8a04] text-[#0f172a] font-bold py-3 rounded-lg transition duration-200 flex justify-center items-center shadow-md">
                <span id="btnText">تسجيل الدخول</span>
                <svg id="loadingSpinner" class="hidden animate-spin ml-2 h-5 w-5 text-[#0f172a]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-200 text-center">
            <p class="text-xs text-gray-400 mb-2">حسابات تجريبية:</p>
            <div class="flex justify-center gap-4 text-xs font-bold">
                <button onclick="fillCredentials('admin', 'Admin12345')" class="text-[#0f172a] hover:text-[#eab308] underline transition">مدير (Admin)</button>
                <button onclick="fillCredentials('operator', 'Operator12345')" class="text-[#0f172a] hover:text-[#eab308] underline transition">مستخدم (User)</button>
            </div>
        </div>

        <!-- رابط تتبع البضاعة العام -->
        <div class="mt-4 pt-4 border-t border-gray-200 text-center">
            <a href="track.html" class="text-sm text-[#0f172a] bg-gray-100 hover:bg-[#eab308] px-4 py-2 rounded-lg font-bold transition inline-block w-full">
                تتبع بضاعة بدون تسجيل دخول
            </a>
        </div>

    </div>

    <script>
        const API_URL = 'http://localhost:5074/api/auth';

        function fillCredentials(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');

            errorDiv.classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.textContent = 'جاري التحقق...';
            spinner.classList.remove('hidden');

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('expiresAt', data.expiresAt);
                    window.location.href = 'dashboard.html';
                } else {
                    let errorMsg = 'حدث خطأ غير متوقع.';
                    if (data.errors) {
                        const firstKey = Object.keys(data.errors)[0];
                        errorMsg = data.errors[firstKey][0];
                    } else if (data.detail) {
                        errorMsg = data.detail;
                    }
                    errorDiv.textContent = errorMsg;
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'تعذر الاتصال بالخادم. تأكد من تشغيل الـ API.';
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = 'تسجيل الدخول';
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
