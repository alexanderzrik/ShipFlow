<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShipFlow - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex">

    <!-- القائمة الجانبية -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col fixed h-full right-0 z-20">
        <div class="p-6 text-center border-b border-gray-800">
            <h1 class="text-3xl font-bold text-blue-400">ShipFlow</h1>
            <p class="text-xs text-gray-400 mt-1">نظام إدارة الشحن</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="loadData('customers')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-800 transition flex items-center gap-3"><span>👥</span> الزبائن</button>
            <button onclick="loadData('packages')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-800 transition flex items-center gap-3"><span>📦</span> البضائع</button>
            <button onclick="loadData('shipments')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-800 transition flex items-center gap-3"><span>🚚</span> الشحنات</button>
            <button onclick="loadData('billofladings')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-800 transition flex items-center gap-3"><span>📄</span> بوالص الشحن</button>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-lg font-bold" id="userAvatar">A</div>
                <div>
                    <p class="text-sm font-semibold" id="userName">جاري التحميل...</p>
                    <p class="text-xs text-gray-400" id="userRole">...</p>
                </div>
            </div>
            <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-sm transition">تسجيل الخروج</button>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 mr-64 p-8">
        <header class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800" id="pageTitle">الزبائن</h2>
            <div class="flex items-center gap-4">
                <button id="addBtn" onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold transition flex items-center gap-2 shadow-md">
                    <span>+</span> إضافة جديد
                </button>
                <div class="text-sm text-gray-500" id="clock"></div>
            </div>
        </header>

        <div id="alertBox" class="hidden mb-4 p-4 rounded-lg"></div>

        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <table class="w-full text-right">
                <thead class="bg-gray-50 border-b border-gray-200 text-gray-600 text-sm"><tr id="tableHeader"></tr></thead>
                <tbody id="tableBody" class="divide-y divide-gray-100 text-sm text-gray-700"></tbody>
            </table>
            <div id="emptyState" class="hidden p-12 text-center text-gray-500">لا توجد بيانات لعرضها.</div>
        </div>

        <div class="mt-6 flex justify-between items-center text-sm text-gray-600" id="paginationBar">
            <div id="pageInfo">الصفحة 1 من 1</div>
            <div class="flex gap-2">
                <button onclick="changePage(-1)" id="prevBtn" class="px-4 py-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50">السابق</button>
                <button onclick="changePage(1)" id="nextBtn" class="px-4 py-2 border rounded-lg hover:bg-gray-50 disabled:opacity-50">التالي</button>
            </div>
        </div>
    </main>

    <!-- نافذة منبثقة -->
    <div id="modalBackdrop" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-bold text-gray-800 mb-6" id="modalTitle">إضافة</h3>
            
            <form id="modalForm" class="space-y-4">
                <input type="hidden" id="editId">
                
                <!-- 1. نموذج الزبائن -->
                <div id="form_customers" class="hidden space-y-4">
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">الاسم الكامل</label><input type="text" id="cust_fullName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">رقم الهاتف</label><input type="text" id="cust_phoneNumber" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">العنوان (اختياري)</label><input type="text" id="cust_address" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">ملاحظات (اختياري)</label><textarea id="cust_notes" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea></div>
                    <div id="cust_isActiveGroup" class="hidden"><label class="flex items-center gap-2 text-gray-700 font-semibold text-sm"><input type="checkbox" id="cust_isActive" class="w-4 h-4"> حساب نشط</label></div>
                </div>

                <!-- 2. نموذج البضائع -->
                <div id="form_packages" class="hidden space-y-4">
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">الوصف</label><input type="text" id="pkg_description" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">الوزن (كغ)</label><input type="number" step="0.01" id="pkg_weight" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">اسم المستلم</label><input type="text" id="pkg_receiverName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">رقم هاتف المستلم</label><input type="text" id="pkg_receiverPhone" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">مدينة الوجهة</label><input type="text" id="pkg_destinationCity" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">ملاحظات (اختياري)</label><textarea id="pkg_notes" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea></div>
                    <div id="pkg_customerGroup"><label class="block text-gray-700 font-semibold mb-1 text-sm">الزبون المالك</label><select id="pkg_customerId" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white"></select></div>
                </div>

                <!-- 3. نموذج الشحنات -->
                <div id="form_shipments" class="hidden space-y-4">
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">مدينة الانطلاق</label><input type="text" id="shp_fromCity" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">مدينة الوصول</label><input type="text" id="shp_toCity" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">اسم السائق (اختياري)</label><input type="text" id="shp_driverName" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">رقم هاتف السائق (اختياري)</label><input type="text" id="shp_driverPhone" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">رقم المركبة (اختياري)</label><input type="text" id="shp_vehicleNumber" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div id="shp_statusGroup" class="hidden">
                        <label class="block text-gray-700 font-semibold mb-1 text-sm">حالة الشحنة</label>
                        <select id="shp_status" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="Loading">Loading (قيد التجميع)</option>
                            <option value="Departed">Departed (انطلقت)</option>
                            <option value="InTransit">InTransit (في الطريق)</option>
                            <option value="Arrived">Arrived (وصلت)</option>
                            <option value="Closed">Closed (مغلقة)</option>
                        </select>
                    </div>
                </div>

                <!-- 4. نموذج البوالص -->
                <div id="form_billofladings" class="hidden space-y-4">
                    <div id="bol_packageGroup"><label class="block text-gray-700 font-semibold mb-1 text-sm">البضاعة المرتبطة</label><select id="bol_packageId" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white"></select></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">أجرة التوصيل (ل.س)</label><input type="number" step="0.01" id="bol_deliveryFee" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">اسم الموظف المُصدر (اختياري)</label><input type="text" id="bol_issuedBy" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                    <div><label class="block text-gray-700 font-semibold mb-1 text-sm">ملاحظات (اختياري)</label><textarea id="bol_notes" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea></div>
                </div>

                <div id="modalActions" class="flex justify-end gap-3 mt-8 border-t pt-4">
                    <button type="button" onclick="closeModal()" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">إلغاء</button>
                    <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition" id="saveBtn">حفظ</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5074/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        const isAdmin = user && user.role === 'Admin';

        if (!token) window.location.href = 'index.html';

        if (user) {
            document.getElementById('userName').textContent = user.fullName || user.username;
            document.getElementById('userRole').textContent = isAdmin ? 'مدير النظام' : 'مستخدم';
            document.getElementById('userAvatar').textContent = (user.fullName || user.username).charAt(0).toUpperCase();
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('ar-SY'); }, 1000);

        let currentEntity = 'customers';
        let currentPage = 1;
        let totalPages = 1;
        const pageSize = 10;
        let customersList = [];
        let packagesList = [];

        async function fetchWithAuth(endpoint, options = {}) {
            const defaultOptions = { headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } };
            const finalOptions = { ...defaultOptions, ...options };
            finalOptions.headers = { ...defaultOptions.headers, ...(options.headers || {}) };
            const response = await fetch(`${API_BASE}${endpoint}`, finalOptions);
            if (response.status === 401) { alert('انتهت الجلسة.'); logout(); return null; }
            if (response.status === 403) { showAlert('ليس لديك صلاحية.', 'error'); return null; }
            return response;
        }

        function showAlert(message, type = 'info') {
            const box = document.getElementById('alertBox');
            box.className = `mb-4 p-4 rounded-lg border ${type === 'error' ? 'bg-red-100 text-red-700 border-red-300' : 'bg-green-100 text-green-700 border-green-300'}`;
            box.textContent = message;
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        async function loadData(entity) {
            currentEntity = entity;
            currentPage = 1;
            const titles = { 'customers': 'الزبائن', 'packages': 'البضائع', 'shipments': 'الشحنات', 'billofladings': 'بوالص الشحن' };
            document.getElementById('pageTitle').textContent = titles[entity];
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600');
                if (btn.getAttribute('onclick').includes(entity)) btn.classList.add('bg-blue-600');
            });
            await fetchAndRenderTable();
        }

        async function fetchAndRenderTable() {
            const tbody = document.getElementById('tableBody');
            const thead = document.getElementById('tableHeader');
            const emptyState = document.getElementById('emptyState');
            
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-400">جاري التحميل...</td></tr>`;
            emptyState.classList.add('hidden');

            try {
                const response = await fetchWithAuth(`/${currentEntity}?page=${currentPage}&pageSize=${pageSize}`);
                if (!response) return;
                const data = await response.json();
                const items = data.items || [];
                totalPages = data.totalPages || 1;
                updatePagination();

                if (items.length === 0) {
                    tbody.innerHTML = ''; thead.innerHTML = ''; emptyState.classList.remove('hidden');
                    return;
                }
                renderHeaders(thead);
                renderRows(tbody, items);
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-red-500">خطأ في الاتصال</td></tr>`;
            }
        }

        function renderHeaders(thead) {
            let headers = [];
            switch(currentEntity) {
                case 'customers': headers = ['الاسم', 'الهاتف', 'العنوان', 'الحالة', 'تاريخ الإضافة']; break;
                case 'packages': headers = ['رقم التتبع', 'الوصف', 'الوزن', 'المستلم', 'الوجهة', 'الحالة']; break;
                case 'shipments': headers = ['رقم الشحنة', 'من', 'إلى', 'السائق', 'الحالة', 'البضائع']; break;
                case 'billofladings': headers = ['رقم البوليصة', 'البضاعة', 'أجرة التوصيل', 'المصدر', 'التاريخ']; break;
            }
            headers.push('الإجراءات');
            thead.innerHTML = headers.map(h => `<th class="px-6 py-4 font-semibold">${h}</th>`).join('');
        }

        function renderRows(tbody, items) {
            tbody.innerHTML = '';
            items.forEach(item => {
                let rowHtml = '';
                switch(currentEntity) {
                    case 'customers':
                        rowHtml = `<td class="px-6 py-4 font-medium">${item.fullName}</td><td class="px-6 py-4" dir="ltr">${item.phoneNumber}</td><td class="px-6 py-4">${item.address || '-'}</td><td class="px-6 py-4">${item.isActive ? '<span class="text-green-600 bg-green-50 px-2 py-1 rounded text-xs">نشط</span>' : '<span class="text-red-600 bg-red-50 px-2 py-1 rounded text-xs">موقوف</span>'}</td><td class="px-6 py-4">${new Date(item.createdAt).toLocaleDateString('ar-SY')}</td>`; break;
                    case 'packages':
                        rowHtml = `<td class="px-6 py-4 font-mono text-blue-600">${item.trackingNumber}</td><td class="px-6 py-4">${item.description}</td><td class="px-6 py-4">${item.weight} كغ</td><td class="px-6 py-4">${item.receiverName}</td><td class="px-6 py-4">${item.destinationCity}</td><td class="px-6 py-4"><span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs">${item.status}</span></td>`; break;
                    case 'shipments':
                        rowHtml = `<td class="px-6 py-4 font-mono text-blue-600">${item.shipmentNumber}</td><td class="px-6 py-4">${item.fromCity}</td><td class="px-6 py-4">${item.toCity}</td><td class="px-6 py-4">${item.driverName || '-'}</td><td class="px-6 py-4"><span class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs">${item.status}</span></td><td class="px-6 py-4 font-bold text-center">${item.packageCount}</td>`; break;
                    case 'billofladings':
                        rowHtml = `<td class="px-6 py-4 font-mono text-blue-600">${item.billNumber}</td><td class="px-6 py-4">${item.packageTrackingNumber}</td><td class="px-6 py-4">${item.deliveryFee} ل.س</td><td class="px-6 py-4">${item.issuedBy || '-'}</td><td class="px-6 py-4">${new Date(item.issuedAt).toLocaleDateString('ar-SY')}</td>`; break;
                }
                rowHtml += `<td class="px-6 py-4 flex gap-2">
                    <button onclick='openEditModal(${JSON.stringify(item).replace(/'/g, "&#39;")})' class="text-blue-600 hover:bg-blue-50 px-3 py-1 rounded transition text-xs font-semibold">تعديل</button>
                    ${isAdmin ? `<button onclick="deleteItem(${item.id})" class="text-red-600 hover:bg-red-50 px-3 py-1 rounded transition text-xs font-semibold">حذف</button>` : ''}
                </td>`;
                tbody.innerHTML += `<tr class="hover:bg-gray-50 transition">${rowHtml}</tr>`;
            });
        }

        function updatePagination() {
            document.getElementById('pageInfo').textContent = `الصفحة ${currentPage} من ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }
        function changePage(delta) { currentPage += delta; fetchAndRenderTable(); }

        // ==========================================
        // 8. عمليات CRUD (مع إصلاح مشكلة الحقول المخفية)
        // ==========================================
        const modal = document.getElementById('modalBackdrop');
        const form = document.getElementById('modalForm');

        // دالة جديدة: تعطيل/تفعيل الحقول داخل قسم معين
        function toggleFormInputs(containerId, enable) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const inputs = container.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                if (input.type !== 'hidden') {
                    input.disabled = !enable;
                }
            });
        }

        function hideAllForms() {
            ['form_customers', 'form_packages', 'form_shipments', 'form_billofladings'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                toggleFormInputs(id, false); // تعطيل الحقول في النموذج المخفي
            });
            document.getElementById('cust_isActiveGroup').classList.add('hidden');
            document.getElementById('shp_statusGroup').classList.add('hidden');
        }

        async function prefetchDropdowns() {
            const custRes = await fetchWithAuth('/customers?pageSize=100');
            if (custRes && custRes.ok) customersList = (await custRes.json()).items;
            const pkgRes = await fetchWithAuth('/packages?pageSize=100');
            if (pkgRes && pkgRes.ok) packagesList = (await pkgRes.json()).items;
        }

        async function openAddModal() {
            form.reset();
            document.getElementById('editId').value = '';
            document.getElementById('modalTitle').textContent = 'إضافة جديد';
            hideAllForms();
            
            await prefetchDropdowns();

            if (currentEntity === 'customers') {
                document.getElementById('form_customers').classList.remove('hidden');
                toggleFormInputs('form_customers', true); // تفعيل الحقول عند الإظهار
            } else if (currentEntity === 'packages') {
                document.getElementById('form_packages').classList.remove('hidden');
                toggleFormInputs('form_packages', true);
                document.getElementById('pkg_customerGroup').classList.remove('hidden');
                const select = document.getElementById('pkg_customerId');
                select.innerHTML = customersList.map(c => `<option value="${c.id}">${c.fullName} (${c.phoneNumber})</option>`).join('');
                if(customersList.length === 0) {
                    showAlert('يجب إضافة زبون أولاً', 'error');
                    return;
                }
            } else if (currentEntity === 'shipments') {
                document.getElementById('form_shipments').classList.remove('hidden');
                toggleFormInputs('form_shipments', true);
            } else if (currentEntity === 'billofladings') {
                document.getElementById('form_billofladings').classList.remove('hidden');
                toggleFormInputs('form_billofladings', true);
                document.getElementById('bol_packageGroup').classList.remove('hidden');
                const select = document.getElementById('bol_packageId');
                select.innerHTML = packagesList.map(p => `<option value="${p.id}">${p.trackingNumber} - ${p.description}</option>`).join('');
                if(packagesList.length === 0) {
                    showAlert('لا توجد بضائع متاحة', 'error');
                }
            }
            modal.classList.remove('hidden');
        }

        function openEditModal(item) {
            form.reset();
            document.getElementById('editId').value = item.id;
            document.getElementById('modalTitle').textContent = 'تعديل';
            hideAllForms();
            
            if (currentEntity === 'customers') {
                document.getElementById('form_customers').classList.remove('hidden');
                toggleFormInputs('form_customers', true);
                document.getElementById('cust_fullName').value = item.fullName;
                document.getElementById('cust_phoneNumber').value = item.phoneNumber;
                document.getElementById('cust_address').value = item.address || '';
                document.getElementById('cust_notes').value = item.notes || '';
                document.getElementById('cust_isActiveGroup').classList.remove('hidden');
                document.getElementById('cust_isActive').checked = item.isActive;
            } else if (currentEntity === 'packages') {
                document.getElementById('form_packages').classList.remove('hidden');
                toggleFormInputs('form_packages', true);
                document.getElementById('pkg_customerGroup').classList.add('hidden');
                document.getElementById('pkg_description').value = item.description;
                document.getElementById('pkg_weight').value = item.weight;
                document.getElementById('pkg_receiverName').value = item.receiverName;
                document.getElementById('pkg_receiverPhone').value = item.receiverPhone;
                document.getElementById('pkg_destinationCity').value = item.destinationCity;
                document.getElementById('pkg_notes').value = item.notes || '';
            } else if (currentEntity === 'shipments') {
                document.getElementById('form_shipments').classList.remove('hidden');
                toggleFormInputs('form_shipments', true);
                document.getElementById('shp_fromCity').value = item.fromCity;
                document.getElementById('shp_toCity').value = item.toCity;
                document.getElementById('shp_driverName').value = item.driverName || '';
                document.getElementById('shp_driverPhone').value = item.driverPhone || '';
                document.getElementById('shp_vehicleNumber').value = item.vehicleNumber || '';
                document.getElementById('shp_statusGroup').classList.remove('hidden');
                document.getElementById('shp_status').value = item.status;
            } else if (currentEntity === 'billofladings') {
                document.getElementById('form_billofladings').classList.remove('hidden');
                toggleFormInputs('form_billofladings', true);
                document.getElementById('bol_packageGroup').classList.add('hidden');
                document.getElementById('bol_deliveryFee').value = item.deliveryFee;
                document.getElementById('bol_issuedBy').value = item.issuedBy || '';
                document.getElementById('bol_notes').value = item.notes || '';
            }
            modal.classList.remove('hidden');
        }

        function closeModal() { modal.classList.add('hidden'); }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const isEdit = !!id;
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.textContent = 'جاري الحفظ...';

            const payload = getPayload(isEdit);
            if (!payload) { btn.disabled = false; btn.textContent = 'حفظ'; return; }

            const endpoint = isEdit ? `/${currentEntity}/${id}` : `/${currentEntity}`;
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const response = await fetchWithAuth(endpoint, { method, body: JSON.stringify(payload) });
                if (!response) return;
                if (response.ok) {
                    showAlert(isEdit ? 'تم التعديل بنجاح' : 'تم الإضافة بنجاح', 'success');
                    closeModal();
                    fetchAndRenderTable();
                } else {
                    const errorData = await response.json();
                    let msg = 'حدث خطأ.';
                    if (errorData.errors) {
                        const firstKey = Object.keys(errorData.errors)[0];
                        msg = errorData.errors[firstKey][0];
                    } else if (errorData.detail) { msg = errorData.detail; }
                    showAlert(msg, 'error');
                }
            } catch (error) {
                showAlert('تعذر الاتصال بالخادم.', 'error');
            } finally {
                btn.disabled = false; btn.textContent = 'حفظ';
            }
        });

        function getPayload(isEdit) {
            if (currentEntity === 'customers') {
                const p = {
                    fullName: document.getElementById('cust_fullName').value.trim(),
                    phoneNumber: document.getElementById('cust_phoneNumber').value.trim(),
                    address: document.getElementById('cust_address').value.trim() || null,
                    notes: document.getElementById('cust_notes').value.trim() || null
                };
                if (isEdit) p.isActive = document.getElementById('cust_isActive').checked;
                return p;
            }
            if (currentEntity === 'packages') {
                const p = {
                    description: document.getElementById('pkg_description').value.trim(),
                    weight: parseFloat(document.getElementById('pkg_weight').value),
                    receiverName: document.getElementById('pkg_receiverName').value.trim(),
                    receiverPhone: document.getElementById('pkg_receiverPhone').value.trim(),
                    destinationCity: document.getElementById('pkg_destinationCity').value.trim(),
                    notes: document.getElementById('pkg_notes').value.trim() || null
                };
                if (!isEdit) {
                    const cid = document.getElementById('pkg_customerId').value;
                    if (!cid) return null;
                    p.customerId = parseInt(cid);
                }
                return p;
            }
            if (currentEntity === 'shipments') {
                const p = {
                    fromCity: document.getElementById('shp_fromCity').value.trim(),
                    toCity: document.getElementById('shp_toCity').value.trim(),
                    driverName: document.getElementById('shp_driverName').value.trim() || null,
                    driverPhone: document.getElementById('shp_driverPhone').value.trim() || null,
                    vehicleNumber: document.getElementById('shp_vehicleNumber').value.trim() || null
                };
                if (isEdit) {
                    const statusVal = document.getElementById('shp_status').value;
                    if (statusVal) p.status = statusVal;
                }
                return p;
            }
            if (currentEntity === 'billofladings') {
                const p = {
                    deliveryFee: parseFloat(document.getElementById('bol_deliveryFee').value),
                    issuedBy: document.getElementById('bol_issuedBy').value.trim() || null,
                    notes: document.getElementById('bol_notes').value.trim() || null
                };
                if (!isEdit) {
                    const pid = document.getElementById('bol_packageId').value;
                    if (!pid) return null;
                    p.packageId = parseInt(pid);
                }
                return p;
            }
            return null;
        }

        async function deleteItem(id) {
            if (!confirm('هل أنت متأكد من الحذف؟')) return;
            const response = await fetchWithAuth(`/${currentEntity}/${id}`, { method: 'DELETE' });
            if (!response) return;
            if (response.ok || response.status === 204) {
                showAlert('تم الحذف بنجاح', 'success');
                fetchAndRenderTable();
            } else {
                const errorData = await response.json().catch(() => ({}));
                let msg = 'حدث خطأ أثناء الحذف.';
                if (errorData.detail) msg = errorData.detail;
                else if (errorData.errors) {
                    const firstKey = Object.keys(errorData.errors)[0];
                    msg = errorData.errors[firstKey][0];
                }
                showAlert(msg, 'error');
            }
        }

        loadData('customers');
    </script>
</body>
</html>
